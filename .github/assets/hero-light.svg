<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Flow-UI</title>
  <desc id="d">A server driven UI framework for SwiftUI. The backend sends JSON, Flow-UI renders the screen.</desc>

  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7DFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#3B7DFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B7DFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3B7DFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3B7DFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B7DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B7DFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B7DFF" stop-opacity="0"/>
    </linearGradient>

    <style>
      /*
        Motion here is deliberately limited to properties whose every keyframe is
        still a good looking frame.

        The first two drafts animated the mark in the way the site does
        (FlowLogo.tsx: connector draws, quiet nodes arrive, centre node lands),
        fading each element up from opacity 0. Both drafts rendered as an empty
        gradient in Quick Look, with and without animation-fill-mode: backwards,
        because a renderer that parses the animation shorthand but never runs the
        timeline sits on the 0% keyframe forever. A hero that is blank anywhere is
        worse than a hero that is still.

        So the mark, the wordmark and the type are plain painted elements with no
        animation attached: they cannot fail. The life comes from the glow, which
        breathes and drifts between two states that are both visible, so being
        frozen at either end still looks intentional.
      */
      .glow {
        animation: breathe 7s ease-in-out infinite, drift 19s ease-in-out infinite;
      }
      @keyframes breathe { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
      @keyframes drift {
        0%, 100% { transform: translateX(-26px); }
        50%      { transform: translateX(26px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" fill="#FFFFFF"/>
  <rect width="1200" height="380" fill="url(#wash)"/>
  <ellipse class="glow" cx="600" cy="150" rx="430" ry="200" fill="url(#glow)"/>

  <!-- The mark, 32 unit artwork scaled to 104 and centred. -->
  <g transform="translate(548 84) scale(3.25)">
    <line x1="7.6" y1="9.28" x2="24.4" y2="22.72"
          stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="7.6" cy="9.28" r="2.6" fill="#0A0A0A"/>
    <circle cx="24.4" cy="22.72" r="2.6" fill="#0A0A0A"/>
    <circle cx="16" cy="16" r="4.4" fill="#3B7DFF"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="252" font-size="60" font-weight="700" letter-spacing="-1.6" fill="#0A0A0A">Flow<tspan fill="#3B7DFF">-UI</tspan></text>
    <text x="600" y="294" font-size="21" font-weight="400" fill="#50505A">Your backend sends JSON. Your app renders the screen.</text>
    <text x="600" y="336" font-size="14" font-weight="500" letter-spacing="2.4" fill="#7D7D85">SWIFTUI &#183; SERVER DRIVEN UI &#183; SWIFT 6</text>
  </g>

  <rect x="360" y="358" width="480" height="1" fill="url(#rule)"/>
</svg>
